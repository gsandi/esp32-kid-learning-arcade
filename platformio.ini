; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32p4]
platform = espressif32
board = elecrow_crowpanel_p4_7
board_dir = boards
framework = espidf
monitor_speed = 115200
upload_protocol = esptool
upload_port = /dev/cu.wchusbserial10
board_build.cmake_extra_args =
	-DIDF_TARGET=esp32p4
board_build.partitions = partitions.csv
platform_packages = platformio/toolchain-riscv32-esp@15.2.0+20251204
build_unflags = -Werror=missing-field-initializers -Wmissing-field-initializers
extra_scripts = post:scripts/flash_slave_fw.py
build_flags =
	-Wno-missing-field-initializers
	-include ${PROJECT_DIR}/sdkconfig_pio_overrides.h
